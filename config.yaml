# Local LiteLLM gateway for CowAgent development.
# Chat and responses are forwarded to the Grok subscription proxy.
# Images are generated by a headless `grok` process. Speech and
# transcription are development stubs. Nothing here is for production.

model_list:
  - model_name: grok-4.7
    litellm_params:
      model: openai/grok-4.7
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 300
    model_info:
      mode: chat
      supports_vision: true
      max_input_tokens: 256000

  - model_name: grok-4.7-build-fast
    litellm_params:
      model: openai/grok-4.7-build-fast
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 300
    model_info:
      mode: chat
      supports_vision: true
      max_input_tokens: 256000

  - model_name: grok-4.6
    litellm_params:
      model: openai/grok-4.6
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 300
    model_info:
      mode: chat
      supports_vision: true
      max_input_tokens: 256000

  - model_name: grok-4.5
    litellm_params:
      model: openai/grok-4.5
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 300
    model_info:
      mode: chat
      supports_vision: true
      max_input_tokens: 256000

  - model_name: grok-image
    litellm_params:
      model: openai/dall-e-3
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 300
    model_info:
      mode: image_generation

  - model_name: grok-tts
    litellm_params:
      model: openai/tts-1
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 60
    model_info:
      mode: audio_speech

  - model_name: grok-asr
    litellm_params:
      model: openai/whisper-1
      api_base: http://127.0.0.1:4010/v1
      api_key: os.environ/ADAPTER_API_KEY
      timeout: 60
    model_info:
      mode: audio_transcription

litellm_settings:
  num_retries: 0
  request_timeout: 300
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Admin UI login stores a session user. This is the project-local Postgres.
  database_url: os.environ/DATABASE_URL
  # Clients talk to this process directly, so there is no proxy address to trust.
  trusted_proxy_ranges: []
